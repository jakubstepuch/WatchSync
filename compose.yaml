# WatchSync: wdrożenie za istniejącym reverse proxy (HTTPS/WSS terminowane w proxy).
# Jedna instancja: stan pokoi jest w pamięci procesu, więc nie skalować na kilka replik.
name: watchsync

services:
  watchsync:
    build: .
    image: watchsync:latest
    container_name: watchsync
    restart: unless-stopped
    init: true # poprawne przekazywanie SIGTERM przy docker stop / restarcie
    environment:
      NODE_ENV: production
      PORT: "3000"
    # Domyślnie port tylko na loopback hosta: aplikacja nie jest wystawiona bezpośrednio do Internetu.
    # W Portainerze można nadpisać zmienną WATCHSYNC_BIND (format "<adres>:<port_hosta>")
    # bez edycji repozytorium. Rzeczywiste adresy i sieci produkcyjne nie trafiają do repo.
    ports:
      - "${WATCHSYNC_BIND:-127.0.0.1:3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
